<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shop | E-Commerce</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="logo"><i class="fa-solid fa-s"></i><i class="fa-solid fa-circle-h" style="color:skyblue;"></i><i class="fa-solid fa-o"></i><i class="fa-solid fa-p"></i><i class="fa-solid fa-e"></i><i class="fa-solid fa-a"></i><i class="fa-solid fa-s"></i><i class="fa-solid fa-cart-shopping" style="color:rgb(209, 170, 97);"></i></div>

    <div class="search-wrap">
      <input id="searchInput"  type="text" placeholder="Search products..."/>
      <select id="categoryFilter">
        <option value="all">All Categories</option>
      </select>
      <select id="sortSelect">
        <option value="default">Sort</option>
        <option value="priceLow">Price: Low → High</option>
        <option value="priceHigh">Price: High → Low</option>
        <option value="ratingHigh">Rating: High → Low</option>
      </select>
      <!-- <button class="bb"><a href="Ehome.html">Back</a></button> -->
      <a href="Ehome.html" class="bb">Back</a>
    </div>

    <button id="cartBtn" class="cart-btn">
      🛒 Cart <span id="cartCount" class="cart-count">0</span>
    </button>
  </header>

  <!-- Main -->
  <main class="main">
    <h1 class="title">Shopping Page</h1>
    <p class="subtitle">Browse products and add them to your cart.</p>

    <section id="productGrid" class="grid"></section>
  </main>

  <!-- Cart Sidebar -->
  <aside id="cartSidebar" class="cart-sidebar">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button id="closeCart" class="icon-btn">✖</button>
    </div>

    <div id="cartItems" class="cart-items"></div>

    <div class="cart-footer">
      <div class="total-row">
        <span>Total</span>
        <strong id="cartTotal">$0.00</strong>
      </div>
      <button id="clearCart" class="btn secondary">Clear Cart</button>
      <button id="checkoutBtn" class="btn primary">Checkout</button>
    </div>
  </aside>

  <!-- Overlay -->
  <div id="overlay" class="overlay"></div>

  

  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: system-ui, Arial, sans-serif;
}

body {
  background-image: url("https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/a5613351-3a61-4da2-89ef-7e1a422a868c/dhtw0v2-9a4f3740-def7-4336-9a22-d1f12e2dfb45.png?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7InBhdGgiOiIvZi9hNTYxMzM1MS0zYTYxLTRkYTItODllZi03ZTFhNDIyYTg2OGMvZGh0dzB2Mi05YTRmMzc0MC1kZWY3LTQzMzYtOWEyMi1kMWYxMmUyZGZiNDUucG5nIn1dXSwiYXVkIjpbInVybjpzZXJ2aWNlOmZpbGUuZG93bmxvYWQiXX0.pkDTA5VSSknvq-ARHtn1VaOjlpQNMh3uqipNWVzapQs");
  background-size: cover;
  color: #e9eefc;
}


.header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: linear-gradient(rgb(127, 100, 201),rgb(78, 27, 173));
  border-bottom: 1px solid rgba(255,255,255,0.08);
  padding: 14px 18px;
  display: flex;
  gap: 14px;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 0.5px;
}

.search-wrap {
  display: flex;
  gap: 10px;
  flex: 1;
  max-width: 820px;

}

.bb {
    display: inline-block;
    background: rgba(255,255,255,0.05);
    color: white;
    padding: 8px 8px;
    text-decoration: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

.bb:hover {
    background-color: #b062cf;
    color: #0b0f17;
}

.bb:active {
    background-color: #ee83c5;
}
 


.search-wrap input,
.search-wrap select {
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(4, 14, 59, 0.05);
  color: #e9eefc;
  outline: none;
  font-weight: bold;
}

.search-wrap input {
  flex: 1;
}

.search-wrap select {
  min-width: 160px;
}

#categoryFilter option{
  background: #121c30;
}

#sortSelect option{
  background: #121c30;
}

.cart-btn {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.1);
  color: #e9eefc;
  padding: 10px 14px;
  border-radius: 14px;
  cursor: pointer;
  font-weight: 700;
  display: flex;
  gap: 10px;
  align-items: center;
}

.cart-count {
  background: #4f7cff;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 12px;
}

/* Main */
.main {
  padding: 28px 18px 70px;
  max-width: 1200px;
  margin: 0 auto;
}

.title {
  font-size: 34px;
  font-weight: 900;
  color: #531858;
}

.subtitle {
  opacity: 0.85;
  margin-top: 8px;
  margin-bottom: 24px;
  color:#0e0511;
}

/* Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
 
}

.card {
  /* background: rgba(255,255,255,0.04); */
  background-image: url("https://marketplace.canva.com/EAGxIrOCxYk/1/0/1280w/canva-purple-and-pink-minimalist-gradient-blank-background-instagram-post-iQUZcijV0cc.jpg");
  background-size: cover;

  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  transition: transform 0.2s ease;
}

.card:hover {
  transform: translateY(-4px);
}

.card-img {
  /* margin-right: 40%; */
  height: 170px;
  display: grid;
  place-items: center;
  background: rgba(255,255,255,0.05);
  font-size: 56px;
}

.card-body {
  padding: 14px;
}

.card-title {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 8px;
}

.card-meta {
  display: flex;
  justify-content: space-between;
  opacity: 0.9;
  font-size: 14px;
  margin-bottom: 12px;
}

.price {
  font-weight: 900;
}

.tag {
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(79,124,255,0.2);
  border: 1px solid rgba(79,124,255,0.35);
}

.card-actions {
  display: flex;
  gap: 10px;
}

.btn {
  width: 100%;
  padding: 10px 12px;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  font-weight: 800;
}

.btn.primary {
  background: #c2cce7;
  color: #0b0f17;
}

.btn.secondary {
  background: rgba(255,255,255,0.07);
  color: #e9eefc;
  border: 1px solid rgba(255,255,255,0.12);
}

/* Cart Sidebar */
.cart-sidebar {
  position: fixed;
  top: 0;
  right: -420px;
  width: 420px;
  max-width: 92vw;
  height: 100vh;
  background: rgba(15, 20, 30, 0.98);
  border-left: 1px solid rgba(255,255,255,0.08);
  box-shadow: -20px 0 60px rgba(0,0,0,0.4);
  z-index: 30;
  display: flex;
  flex-direction: column;
  transition: right 0.25s ease;
}

.cart-sidebar.open {
  right: 0;
}

.cart-header {
  padding: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.icon-btn {
  background: transparent;
  border: none;
  color: #e9eefc;
  font-size: 18px;
  cursor: pointer;
}

.cart-items {
  padding: 16px;
  overflow: auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.cart-item {
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.03);
  border-radius: 16px;
  padding: 12px;
  display: grid;
  grid-template-columns: 54px 1fr auto;
  gap: 12px;
  align-items: center;
}

.cart-emoji {
  font-size: 34px;
  height: 54px;
  width: 54px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: rgba(255,255,255,0.04);
}

.cart-name {
  font-weight: 800;
  margin-bottom: 4px;
}

.cart-small {
  opacity: 0.85;
  font-size: 13px;
}

.qty-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}

.qty-controls button {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.06);
  color: #e9eefc;
  cursor: pointer;
  font-weight: 900;
}

.cart-footer {
  padding: 16px;
  border-top: 1px solid rgba(255,255,255,0.08);
  display: grid;
  gap: 10px;
}

.total-row {
  display: flex;
  justify-content: space-between;
  font-size: 16px;
  margin-bottom: 6px;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
  z-index: 20;
}

.overlay.show {
  opacity: 1;
  pointer-events: all;
}

/* Responsive */
@media (max-width: 1100px) {
  .grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (max-width: 800px) {
  .search-wrap {
    flex-direction: column;
  }
  .grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 520px) {
  .grid {
    grid-template-columns: 1fr;
  }
}

    
    </style>

    <script>
        // Demo products (you can replace with API later)
const PRODUCTS = [
  { id: 1, name: "Wireless Headphones", price: 59.99, rating: 4.7, category: "Electronics", emoji: "🎧" },
  { id: 2, name: "Smart Watch", price: 79.99, rating: 4.5, category: "Electronics", emoji: "⌚" },
  { id: 3, name: "Running Shoes", price: 49.99, rating: 4.6, category: "Fashion", emoji: "👟" },
  { id: 4, name: "Leather Wallet", price: 19.99, rating: 4.2, category: "Fashion", emoji: "👛" },
  { id: 5, name: "Coffee Maker", price: 39.99, rating: 4.3, category: "Home", emoji: "☕" },
  { id: 6, name: "Air Fryer", price: 89.99, rating: 4.8, category: "Home", emoji: "🍟" },
  { id: 7, name: "Gaming Mouse", price: 29.99, rating: 4.4, category: "Electronics", emoji: "🖱️" },
  { id: 8, name: "Backpack", price: 24.99, rating: 4.1, category: "Fashion", emoji: "🎒" },
  { id: 9, name: "Desk Lamp", price: 15.99, rating: 4.0, category: "Home", emoji: "💡" },
  { id: 10, name: "Bluetooth Speaker", price: 34.99, rating: 4.6, category: "Electronics", emoji: "🔊" },
  { id: 11, name: "Sunglasses", price: 12.99, rating: 4.1, category: "Fashion", emoji: "🕶️" },
  { id: 12, name: "Kitchen Knife Set", price: 44.99, rating: 4.5, category: "Home", emoji: "🔪" },
];

const els = {
  productGrid: document.getElementById("productGrid"),
  searchInput: document.getElementById("searchInput"),
  categoryFilter: document.getElementById("categoryFilter"),
  sortSelect: document.getElementById("sortSelect"),
  cartBtn: document.getElementById("cartBtn"),
  cartSidebar: document.getElementById("cartSidebar"),
  closeCart: document.getElementById("closeCart"),
  overlay: document.getElementById("overlay"),
  cartItems: document.getElementById("cartItems"),
  cartTotal: document.getElementById("cartTotal"),
  cartCount: document.getElementById("cartCount"),
  clearCart: document.getElementById("clearCart"),
  checkoutBtn: document.getElementById("checkoutBtn"),
};

// Cart state: { [productId]: qty }
let cart = JSON.parse(localStorage.getItem("cart_v1") || "{}");

function saveCart() {
  localStorage.setItem("cart_v1", JSON.stringify(cart));
}

function getCartCount() {
  return Object.values(cart).reduce((sum, qty) => sum + qty, 0);
}

function getCartTotal() {
  let total = 0;
  for (const [id, qty] of Object.entries(cart)) {
    const p = PRODUCTS.find(x => x.id === Number(id));
    if (p) total += p.price * qty;
  }
  return total;
}

function openCart() {
  els.cartSidebar.classList.add("open");
  els.overlay.classList.add("show");
  renderCart();
}

function closeCart() {
  els.cartSidebar.classList.remove("open");
  els.overlay.classList.remove("show");
}

function addToCart(productId) {
  cart[productId] = (cart[productId] || 0) + 1;
  saveCart();
  updateCartUI();
}

function removeFromCart(productId) {
  delete cart[productId];
  saveCart();
  updateCartUI();
  renderCart();
}

function changeQty(productId, delta) {
  const next = (cart[productId] || 0) + delta;
  if (next <= 0) {
    delete cart[productId];
  } else {
    cart[productId] = next;
  }
  saveCart();
  updateCartUI();
  renderCart();
}

function clearCart() {
  cart = {};
  saveCart();
  updateCartUI();
  renderCart();
}

function updateCartUI() {
  els.cartCount.textContent = getCartCount();
  els.cartTotal.textContent = `$${getCartTotal().toFixed(2)}`;
}

function buildCategories() {
  const cats = [...new Set(PRODUCTS.map(p => p.category))].sort();
  for (const c of cats) {
    const opt = document.createElement("option");
    opt.value = c;
    opt.textContent = c;
    els.categoryFilter.appendChild(opt);
  }
}

function filteredProducts() {
  const q = els.searchInput.value.trim().toLowerCase();
  const cat = els.categoryFilter.value;
  const sort = els.sortSelect.value;

  let list = PRODUCTS.filter(p => {
    const matchesSearch =
      p.name.toLowerCase().includes(q) ||
      p.category.toLowerCase().includes(q);

    const matchesCat = cat === "all" ? true : p.category === cat;
    return matchesSearch && matchesCat;
  });

  if (sort === "priceLow") list.sort((a, b) => a.price - b.price);
  if (sort === "priceHigh") list.sort((a, b) => b.price - a.price);
  if (sort === "ratingHigh") list.sort((a, b) => b.rating - a.rating);

  return list;
}

function renderProducts() {
  const list = filteredProducts();
  els.productGrid.innerHTML = "";

  if (list.length === 0) {
    els.productGrid.innerHTML = `<p style="opacity:0.85;">No products found.</p>`;
    return;
  }

  for (const p of list) {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="card-img">${p.emoji}</div>
      <div class="card-body">
        <div class="card-title">${p.name}</div>
        <div class="card-meta">
          <span class="price">$${p.price.toFixed(2)}</span>
          <span class="tag">⭐ ${p.rating}</span>
        </div>
        <div class="card-meta">
          <span style="opacity:0.9;">${p.category}</span>
          <span style="opacity:0.8;">ID: ${p.id}</span>
        </div>
        <div class="card-actions">
          <button class="btn primary" data-add="${p.id}">Add to Cart</button>
        </div>
      </div>
    `;

    els.productGrid.appendChild(card);
  }

  // Button handlers
  document.querySelectorAll("[data-add]").forEach(btn => {
    btn.addEventListener("click", () => {
      addToCart(btn.getAttribute("data-add"));
    });
  });
}

function renderCart() {
  els.cartItems.innerHTML = "";

  const ids = Object.keys(cart);
  if (ids.length === 0) {
    els.cartItems.innerHTML = `<p style="opacity:0.85;">Your cart is empty.</p>`;
    updateCartUI();
    return;
  }

  for (const id of ids) {
    const p = PRODUCTS.find(x => x.id === Number(id));
    if (!p) continue;

    const qty = cart[id];
    const row = document.createElement("div");
    row.className = "cart-item";

    row.innerHTML = `
      <div class="cart-emoji">${p.emoji}</div>
      <div>
        <div class="cart-name">${p.name}</div>
        <div class="cart-small">$${p.price.toFixed(2)} • ⭐ ${p.rating}</div>

        <div class="qty-controls">
          <button data-minus="${p.id}">−</button>
          <strong>${qty}</strong>
          <button data-plus="${p.id}">+</button>
          <button data-remove="${p.id}" style="margin-left:auto;">Remove</button>
        </div>
      </div>
      <div style="font-weight:900;">
        $${(p.price * qty).toFixed(2)}
      </div>
    `;

    els.cartItems.appendChild(row);
  }

  document.querySelectorAll("[data-plus]").forEach(btn => {
    btn.addEventListener("click", () => changeQty(btn.dataset.plus, 1));
  });

  document.querySelectorAll("[data-minus]").forEach(btn => {
    btn.addEventListener("click", () => changeQty(btn.dataset.minus, -1));
  });

  document.querySelectorAll("[data-remove]").forEach(btn => {
    btn.addEventListener("click", () => removeFromCart(btn.dataset.remove));
  });

  updateCartUI();
}

// Events
els.searchInput.addEventListener("input", renderProducts);
els.categoryFilter.addEventListener("change", renderProducts);
els.sortSelect.addEventListener("change", renderProducts);

els.cartBtn.addEventListener("click", openCart);
els.closeCart.addEventListener("click", closeCart);
els.overlay.addEventListener("click", closeCart);

els.clearCart.addEventListener("click", clearCart);

els.checkoutBtn.addEventListener("click", () => {
  const total = getCartTotal().toFixed(2);
  if (getCartCount() === 0) {
    alert("Your cart is empty.");
    return;
  }
  alert(`Checkout successful! Total: $${total}\n\n(You can connect this to payment later.)`);
  clearCart();
  closeCart();
});

// Init
buildCategories();
renderProducts();
updateCartUI();

    </script>


  <script src="script.js"></script>
</body>
</html>
